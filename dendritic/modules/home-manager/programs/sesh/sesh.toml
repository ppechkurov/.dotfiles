#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json

blacklist = ["scratch"]

[[session]]
name = "dots"
path = "~/.dotfiles"
preview_command = "eza --icons --color=always"

[[session]]
name = "nvim"
path = "~/.dotfiles/dendritic/modules/home-manager/programs/nvim/config"
startup_command = "nvim init.lua"
